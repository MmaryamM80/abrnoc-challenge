---
- name: Add two disposable Ceph KVM guests on the test host
  hosts: virt_hosts
  become: true
  gather_facts: true
  vars:
    ceph_lab_dir: /var/lib/libvirt/images/abrnoc-ceph-lab
    ceph_base_image: "{{ ceph_lab_dir }}/debian-13-genericcloud-amd64.qcow2"
    ceph_ha_guests:
      - { name: ceph2, ip: 192.168.122.125, mac: '52:54:00:ab:10:25', serial: CEPHOSD2 }
      - { name: ceph3, ip: 192.168.122.126, mac: '52:54:00:ab:10:26', serial: CEPHOSD3 }
  tasks:
    - name: Run ceph_guests expand tasks
      ansible.builtin.import_role:
        name: ceph_guests
        tasks_from: expand
