---
- name: Verify the three-guest Ceph laboratory
  hosts: ceph_lab
  become: true
  gather_facts: false
  vars:
    probe_input: /tmp/abrnoc-ceph-verify-input
    probe_output: /tmp/abrnoc-ceph-verify-output
    probe_object: abrnoc-ceph-verify
  tasks:
    - name: Run ceph_cluster verify tasks
      ansible.builtin.import_role:
        name: ceph_cluster
        tasks_from: verify
