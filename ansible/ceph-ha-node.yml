---
- name: Export bootstrap material from the existing Ceph monitor
  hosts: ceph1
  become: true
  gather_facts: false
  tasks:
    - name: Run ceph_cluster export tasks
      ansible.builtin.import_role:
        name: ceph_cluster
        tasks_from: export

- name: Join each new guest to Ceph without losing monitor quorum
  hosts: ceph_ha_new
  serial: 1
  become: true
  gather_facts: true
  vars:
    ceph_mon_dir: "/var/lib/ceph/mon/ceph-{{ inventory_hostname }}"
    ceph_mgr_dir: "/var/lib/ceph/mgr/ceph-{{ inventory_hostname }}"
  tasks:
    - name: Run ceph_cluster join tasks
      ansible.builtin.import_role:
        name: ceph_cluster
        tasks_from: join

- name: Set three-replica Ceph policy and verify all guests
  hosts: ceph1
  become: true
  gather_facts: true
  tasks:
    - name: Run ceph_cluster replicate tasks
      ansible.builtin.import_role:
        name: ceph_cluster
        tasks_from: replicate
