---
- name: Bootstrap an isolated single-node Ceph functional lab
  hosts: ceph_lab
  become: true
  gather_facts: true
  vars:
    ceph_osd_device: /dev/disk/by-id/virtio-CEPHOSD1
    ceph_mon_dir: /var/lib/ceph/mon/ceph-ceph1
    ceph_mgr_dir: /var/lib/ceph/mgr/ceph-ceph1
  tasks:
    - name: Run ceph_cluster bootstrap tasks
      ansible.builtin.import_role:
        name: ceph_cluster
        tasks_from: bootstrap
