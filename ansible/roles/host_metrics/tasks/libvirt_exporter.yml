---
- name: Install libvirt exporter
  ansible.builtin.apt:
    name: prometheus-libvirt-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Bind libvirt exporter to local monitoring
  ansible.builtin.copy:
    content: 'ARGS="--web.listen-address=127.0.0.1:9177"'
    dest: /etc/default/prometheus-libvirt-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart libvirt exporter

- name: Grant libvirt exporter access to the libvirt system socket
  ansible.builtin.user:
    name: prometheus
    groups: libvirt
    append: true
  notify: Restart libvirt exporter

- name: Enable libvirt exporter
  ansible.builtin.systemd_service:
    name: prometheus-libvirt-exporter
    enabled: true
    state: started
