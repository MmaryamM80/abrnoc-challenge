---
- name: Configure persistent journald storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: '2755'

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install journald retention configuration
  ansible.builtin.copy:
    content: "[Journal]\nStorage=persistent\nSystemMaxUse=1G\n"
    dest: /etc/systemd/journald.conf.d/50-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald
