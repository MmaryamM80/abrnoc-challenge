---
- name: Require a provisioning public key
  ansible.builtin.assert:
    that:
      - virt_host_admin_public_key is match('^ssh-(ed25519|rsa) ')
    fail_msg: Provide a valid SSH public key in keys/admin.pub.

- name: Create the administration user
  ansible.builtin.user:
    name: "{{ virt_host_admin_user }}"
    shell: /bin/bash
    groups: sudo,libvirt
    append: true
    create_home: true
    state: present

- name: Create administrator SSH directory
  ansible.builtin.file:
    path: "/home/{{ virt_host_admin_user }}/.ssh"
    state: directory
    owner: "{{ virt_host_admin_user }}"
    group: "{{ virt_host_admin_user }}"
    mode: '0700'

- name: Manage administrator public key without duplicating or removing unrelated keys
  ansible.builtin.lineinfile:
    path: "/home/{{ virt_host_admin_user }}/.ssh/authorized_keys"
    regexp: '^{{ (virt_host_admin_public_key.split()[:2] | join(" ")) | regex_escape }}(?:\s+.*)?$'
    line: "{{ virt_host_admin_public_key }}"
    create: true
    owner: "{{ virt_host_admin_user }}"
    group: "{{ virt_host_admin_user }}"
    mode: '0600'
  no_log: true

- name: Permit passwordless administration for automation user
  ansible.builtin.copy:
    content: "{{ virt_host_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ virt_host_admin_user }}"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Install SSH hardening drop-in
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  register: virt_host_ssh_dropin
  notify: Reload SSH

- name: Remove superseded SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-virt-host.conf
    state: absent
  register: virt_host_ssh_old_dropin
  notify: Reload SSH

- name: Validate SSH configuration before reloading
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: Inspect effective SSH authentication policy
  ansible.builtin.command: /usr/sbin/sshd -T
  register: virt_host_sshd_effective
  changed_when: false
  check_mode: false

- name: Require key-only non-root SSH access
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in virt_host_sshd_effective.stdout_lines"
      - "'passwordauthentication no' in virt_host_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in virt_host_sshd_effective.stdout_lines"
    fail_msg: SSH authentication policy is overridden; inspect earlier sshd_config drop-ins.
  when: not ansible_check_mode or not (virt_host_ssh_dropin.changed or virt_host_ssh_old_dropin.changed)
