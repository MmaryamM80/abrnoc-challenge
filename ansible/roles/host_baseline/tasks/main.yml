---
- name: Require a Debian-family virtualization host
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: These host roles support Debian-family targets only.

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ virt_host_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure persistent journald storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: '2755'

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install journald retention configuration
  ansible.builtin.copy:
    content: "[Journal]\nStorage=persistent\nSystemMaxUse=1G\n"
    dest: /etc/systemd/journald.conf.d/50-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald

- name: Install conservative kernel settings
  ansible.builtin.copy:
    content: "# Keep VM I/O asynchronous capacity and modest host swap tendency.\nfs.aio-max-nr = 1048576\nvm.swappiness = 10\n"
    dest: /etc/sysctl.d/90-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl

- name: Install nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/nft -c -f %s'
  notify: Reload nftables

- name: Enable baseline services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - nftables
    - rsyslog
