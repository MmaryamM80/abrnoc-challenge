---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
