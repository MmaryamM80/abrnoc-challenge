---
- name: Install Prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Bind Prometheus locally
  ansible.builtin.copy:
    content: 'ARGS="--web.listen-address=127.0.0.1:9090"'
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: '0644'
  notify: Reload Prometheus

- name: Install Prometheus scrape and Alertmanager config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: '0640'
  notify: Reload Prometheus

- name: Install alert rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/virt-host-alerts.yml"
    dest: /etc/prometheus/virt-host-alerts.yml
    owner: root
    group: prometheus
    mode: '0640'
    validate: '/usr/bin/promtool check rules %s'
  notify: Reload Prometheus

- name: Enable Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
