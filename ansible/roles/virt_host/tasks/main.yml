---
- name: Install KVM and exporter packages
  ansible.builtin.apt:
    name: "{{ virt_host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create node exporter textfile directory for controlled alert tests
  ansible.builtin.file:
    path: "{{ virt_host_node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bind node exporter to local monitoring and enable textfile metrics
  ansible.builtin.copy:
    content: 'ARGS="--web.listen-address=127.0.0.1:9100 --collector.textfile.directory={{ virt_host_node_exporter_textfile_dir }}"'
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart exporters

- name: Bind libvirt exporter to local monitoring
  ansible.builtin.copy:
    content: 'ARGS="--web.listen-address=127.0.0.1:9177"'
    dest: /etc/default/prometheus-libvirt-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart exporters

- name: Grant libvirt exporter access to the libvirt system socket
  ansible.builtin.user:
    name: prometheus
    groups: libvirt
    append: true
  notify: Restart exporters

- name: Enable virtualization and exporter services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - libvirtd
    - prometheus-node-exporter
    - prometheus-libvirt-exporter
