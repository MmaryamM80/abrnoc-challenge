---
- name: Create a separate one-node Ceph KVM test guest
  hosts: virt_hosts
  become: true
  gather_facts: true
  vars:
    ceph_lab_dir: /var/lib/libvirt/images/abrnoc-ceph-lab
    ceph_lab_name: ceph1
    ceph_lab_ip: 192.168.122.124
    ceph_lab_mac: '52:54:00:ab:10:24'
    ceph_lab_image: "{{ ceph_lab_dir }}/debian-13-genericcloud-amd64.qcow2"
    ceph_lab_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
  tasks:
    - name: Run ceph_guests bootstrap tasks
      ansible.builtin.import_role:
        name: ceph_guests
        tasks_from: bootstrap
