groups:
  - name: virt-host
    rules:
      - alert: DiskLatencyHigh
        expr: |
          (
            (
              rate(node_disk_read_time_seconds_total{device!~"^(loop|sr).*"}[5m])
              + rate(node_disk_write_time_seconds_total{device!~"^(loop|sr).*"}[5m])
            )
            /
            clamp_min(
              rate(node_disk_reads_completed_total{device!~"^(loop|sr).*"}[5m])
              + rate(node_disk_writes_completed_total{device!~"^(loop|sr).*"}[5m]),
              0.001
            ) > 0.05
          ) or (abrnoc_test_disk_latency_high == 1)
        for: 1m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "Disk latency above 50 ms on {{ $labels.instance }}"
          action: "Check device errors, RAID state, and storage queue before considering a reboot."
      - alert: RAIDDegraded
        expr: |
          (node_md_disks_required - node_md_disks_active > 0)
          or (abrnoc_test_raid_degraded == 1)
        for: 1m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "RAID array degraded on {{ $labels.instance }}"
          action: "Identify the failed member and protect data; do not auto-rebuild before checking media health."
      - alert: HostLoadHigh
        expr: node_load1 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 10m
        labels: {severity: warning, team: infrastructure}
        annotations:
          summary: "Host load exceeds 2 per CPU on {{ $labels.instance }}"
      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "Less than 10% memory available on {{ $labels.instance }}"
      - alert: HostPacketDrops
        expr: |
          (
            rate(node_network_receive_drop_total{device!~"^(lo|veth|tap|virbr).*"}[5m])
            + rate(node_network_transmit_drop_total{device!~"^(lo|veth|tap|virbr).*"}[5m])
          )
          /
          clamp_min(
            rate(node_network_receive_packets_total{device!~"^(lo|veth|tap|virbr).*"}[5m])
            + rate(node_network_transmit_packets_total{device!~"^(lo|veth|tap|virbr).*"}[5m]),
            1
          ) > 0.01
        for: 5m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "NIC packet drops exceed 1% on {{ $labels.instance }}"
          action: "Check link, driver, RX rings, switch counters, and independent reachability probes."
      - alert: LibvirtExporterDown
        expr: up{job="libvirt"} == 0
        for: 2m
        labels: {severity: warning, team: infrastructure}
        annotations:
          summary: "Libvirt exporter is unreachable on {{ $labels.instance }}"
      - alert: LibvirtCollectionFailed
        expr: libvirt_up{job="libvirt"} == 0
        for: 2m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "Libvirt exporter cannot query libvirt on {{ $labels.instance }}"
      - alert: VMFailed
        expr: libvirt_domain_info_vstate{job="libvirt"} == 6
        for: 1m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "VM {{ $labels.domain }} crashed on {{ $labels.instance }}"
          action: "Check host storage and the guest event log before restarting this VM."
      - alert: HostExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: critical, team: infrastructure}
        annotations:
          summary: "Node exporter is unreachable on {{ $labels.instance }}"
